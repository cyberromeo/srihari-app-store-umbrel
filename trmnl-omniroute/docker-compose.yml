version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: trmnl-omniroute_web_1
      APP_PORT: 20128
      PROXY_AUTH_ADD: "false"

  redis:
    image: docker.io/library/redis:8.6.5-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: diegosouzapw/omniroute:3.8.50-web
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-20129}:${API_PORT:-20129}"
      - "${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    environment:
      - DATA_DIR=${DATA_DIR:-/app/data}
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-20128}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - LIVE_WS_PORT=${LIVE_WS_PORT:-20132}
      - LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}
      - LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-*}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Serve the dashboard under a sub-path. Empty = root, which is what
      # Umbrel's app_proxy expects; upstream added this in 3.8.50.
      - OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}
      # Node heap ceiling, not a reservation. Upstream raised this in 3.8.50
      # because large provider catalogs could exhaust the default heap.
      - NODE_OPTIONS=--max-old-space-size=2048
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis-data:
  omniroute-data:
