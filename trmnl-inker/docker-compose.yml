version: "3.7"

services:

  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1 — Umbrel proxy → real web service
      APP_HOST: trmnl-inker_app_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  app:
    image: wojooo/inker:latest
    restart: unless-stopped
    environment:
      # Login PIN. MUST be quoted in YAML (leading zeros stripped otherwise).
      # Change for production via .env.
      ADMIN_PIN: "${ADMIN_PIN:-1111}"
      TZ: ${TZ:-UTC}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      # Allow Umbrel's reverse proxy origin.
      CORS_ORIGINS: "*"
      # App advertised external port (informational; container listens on :80).
      INKER_PORT: "80"
    volumes:
      # SQLite database (/app/uploads/inker.db) + user uploads live here.
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1/health');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  uploads: