releaseNotes: >-
  Packaged against Inker 0.6.0 (wojooo/inker:0.6.0). The store previously advertised 1.0.0, which was never an upstream release — this corrects the number so future Inker releases show up as updates.


  0.6.0 adds TRMNL X (10.3") rendering at 1872x1404 with 16-level grayscale and automatic OG/X detection, a monthly Calendar widget with localized names and configurable week start, optional per-playlist touch-bar control on TRMNL X, and text wrapping in custom widget grid cells. Fixes: the Seeed OG DIY kit now receives a BMP instead of a PNG, and the false "firmware update available" notice is gone. Default widgets and device models are now re-seeded idempotently on every boot, so upgrades pick up newly shipped content without touching your devices, screens or playlists.


  Note: PostgreSQL support was dropped upstream — Inker is SQLite-only, which is how this package already ran it, so no migration is needed here.
