manifestVersion: 1
id: trmnl-inker
name: Inker
tagline: Self-hosted e-ink device manager with drag-and-drop screen designer
icon: https://raw.githubusercontent.com/cyberromeo/srihari-app-store-umbrel/main/trmnl-inker/icon.svg
category: automation
version: "0.6.0"
port: 8090
description: >-
  Inker is a self-hosted e-ink display management server for the homelab community. It works with TRMNL OG and TRMNL X devices (firmware 1.7.8+) and any BYOD e-ink display. Design screens with a drag-and-drop widget editor, build custom widgets from JSON/RSS data sources with JavaScript transformations, run playlists, and integrate homelab tools like Grafana panels.


  Built with TypeScript/React/Prisma. All-in-one Docker container with bundled SQLite, headless Chromium for BMP rendering, and nginx — no external database or cache containers needed. Schema migrations apply automatically on startup.


  After install, open the web UI and log in with the default PIN (1111). Change the PIN via the ADMIN_PIN env var for any real deployment.
