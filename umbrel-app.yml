manifestVersion: 1
id: srihari-bettercap
name: Bettercap
tagline: The Swiss Army knife for WiFi, Bluetooth Low Energy, wireless HID hijacking, CAN-bus and IPv4 and IPv6 networks reconnaissance and MITM attacks.
icon: https://i.imgur.com/OqqoY3A.png
category: networking
version: "2.41.0"
port: 1405
description: >-
  ⚙️ bettercap is a powerful, easily extensible and portable framework written in Go which aims to offer to security researchers, red teamers and reverse engineers an easy to use, all-in-one solution with all the features they might possibly need for performing reconnaissance and attacking WiFi networks, Bluetooth Low Energy devices, CAN-bus, wireless HID devices and Ethernet networks.

developer: SRI
website: https://www.bettercap.org/
submitter: srihari
submission: https://github.com/bettercap/bettercap
repo: https://github.com/bettercap/bettercap
gallery:
  - https://raw.githubusercontent.com/bettercap/media/master/ui-events.png
releaseNotes: >-
  WiFi networks scanning, deauthentication attack, clientless PMKID association attack and automatic WPA/WPA2/WPA3 client handshakes capture.
Bluetooth Low Energy devices scanning, characteristics enumeration, reading and writing.
2.4Ghz wireless devices scanning and MouseJacking attacks with over-the-air HID frames injection (with DuckyScript support).
CAN-bus and DBC support for decoding, injecting and fuzzing frames.
Passive and active IP network hosts probing and recon.
ARP, DNS, NDP and DHCPv6 spoofers for MITM attacks on IPv4 and IPv6 based networks.
Proxies at packet level, TCP level and HTTP/HTTPS application level fully scriptable with easy to implement javascript plugins.
dependencies:
path: "/"
defaultUsername: ""
defaultPassword: ""
