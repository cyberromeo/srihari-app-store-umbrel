releaseNotes: >-
  Updated Terminus to v0.72.0 (ghcr.io/usetrmnl/terminus:0.72.0), five releases on from 0.67.0.


  New: export and import designs as zip files to share screen templates with others; localization of UI text, dates and times for 25+ languages, falling back to English for missing keys; screens now cross-link to the extension and template that produced them; Liquid syntax is accepted in extension exchange URIs, headers and request bodies, with a code editor for templates.


  Fixes and upkeep: SVG circle, ellipse and line sanitization no longer strips Y coordinates; atomic screen upserts; firmware and screen attachment handling; TRMNL API 0.20.0, which adds firmware flashes; Rodauth 2.45.0 and Node 26.7.0. The bundled database moves from postgres:18.4-alpine to 18.6-alpine, matching upstream.
