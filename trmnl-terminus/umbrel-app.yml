description: >-
  Terminus is the flagship TRMNL Build-Your-Own-Server (BYOS) application — a Ruby/Hanami web server that lets you manage TRMNL e-ink display devices on your own local network or hosted cloud.


  It provides a dashboard, device/sensor/playlist management, firmware serving, extension marketplace, and a full REST/SSE API — compatible with the TRMNL Core server while adding self-hosted-only features like multi-user accounts and Docker support. You own the stack and the data.


  The first user to register automatically becomes the verified admin. Subsequent users must be manually verified before they can access the system. There are no fixed default credentials — set your own on first launch.
