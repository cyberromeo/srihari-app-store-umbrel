version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: trmnl-cronicle_app_1
      APP_PORT: 3012
      PROXY_AUTH_ADD: "false"

  app:
    image: soulteary/cronicle:latest
    restart: unless-stopped
    hostname: cronicle
    command: >
      sh -c "rm -f /opt/cronicle/logs/cronicled.pid && exec node bin/docker-entrypoint.js"
    volumes:
      # Keep Cronicle data, logs, and installed plugins accessible in Umbrel's
      # app-data directory rather than Docker-only named volumes.
      - ${APP_DATA_DIR}/data:/opt/cronicle/data
      - ${APP_DATA_DIR}/logs:/opt/cronicle/logs
      - ${APP_DATA_DIR}/plugins:/opt/cronicle/plugins
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3012/api/app/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
