manifestVersion: 1
id: trmnl-cronicle
name: Cronicle
tagline: Distributed task scheduler and runner with web UI
icon: https://raw.githubusercontent.com/cyberromeo/srihari-app-store-umbrel/main/trmnl-cronicle/icon.png
category: Automation
version: "0.9.81"
port: 3012
description: >-
  Cronicle is a multi-server task scheduler and runner, with a web based
  front-end UI. It handles both scheduled, repeating and on-demand jobs,
  targeting any number of worker servers, with real-time stats and live
  log viewer.


  Features: single or multi-server setup, automated failover, auto-discovery
  of nearby servers, real-time job status with live log viewer, plugins in
  any language, schedule events in multiple timezones, CPU/memory tracking,
  historical stats with graphs, web hooks, and a REST API.


  After install, open the web UI and log in with admin / admin. Change the
  password immediately via My Account.
developer: Joseph Huckaby
website: https://cronicle.net
submitter: TRMNL
submission: https://github.com/psrih/umbrel-terminus
repo: https://github.com/jhuckaby/Cronicle
support: https://github.com/jhuckaby/Cronicle/issues
gallery:
  - https://pixlcore.com/software/cronicle/screenshots-new/home.png
  - https://pixlcore.com/software/cronicle/screenshots-new/schedule.png
  - https://pixlcore.com/software/cronicle/screenshots-new/job-details-complete.png
releaseNotes: >-
  Packaging revision for the app icon. Cronicle itself is unchanged and still runs soulteary/cronicle:0.9.80 — the third digit moved to 0.9.81 only so umbrelOS offers the update and picks up the new icon.


  The icon now uses Cronicle's own logo from jhuckaby/Cronicle, composited onto a solid tile, instead of a third-party CDN link that could disappear.


  There is no newer Cronicle build to package: the image has not been rebuilt since June 2025, while upstream Cronicle is at 0.9.131.
dependencies: []
path: ""
defaultUsername: "admin"
defaultPassword: "admin"
