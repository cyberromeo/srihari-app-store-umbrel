releaseNotes: >-
  Updated LaraPaper to 0.41.0 (ghcr.io/usetrmnl/larapaper:0.41.0), covering the 0.40.0 and 0.41.0 releases.


  0.41.0 reworks navigation with crosslinks and callouts, and adds map support via TRMNL Framework 3.3.1. The container base is refreshed to PHP 8.4.24, Chromium 152.0.7977.64 and ImageMagick 7.1.2-30.


  0.40.0 was LaraPaper's 100th release: OTA firmware and touchbar history for TRMNL X, device pause with a custom duration (holiday mode), an initial MCP server as a Lab feature, a lat_lon config field type, install-from-catalog without closing the modal, persistent device auto-join, and a new app logo. Fixes cover device preview rotation on dashboards and multi-day iCal events.
